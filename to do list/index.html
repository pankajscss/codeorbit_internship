
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interactive To-Do List</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="todo-container">
        <header class="todo-header">
            <h1>My To-Do List</h1>
            <p>Organize your day, one task at a time.</p>
        </header>

        <form id="todo-form" class="todo-form">
            <input
                type="text"
                id="task-input"
                placeholder="Enter a new task..."
                aria-label="New task"
                maxlength="200"
                required
            >

            <button type="submit" class="add-btn">
                Add Task
            </button>
        </form>

        <p id="task-counter" class="task-counter">
            0 tasks remaining
        </p>

        <ul id="task-list" class="task-list">
            <!-- Tasks are added dynamically by JavaScript -->
        </ul>

        <p id="empty-message" class="empty-message">
            No tasks yet. Add your first task!
        </p>

        <footer class="todo-footer">
            <span>Stay focused. Stay productive.</span>
            <button id="clear-completed" class="clear-btn" type="button">
                Clear Completed
            </button>
        </footer>
    </main>

</body>
</html>
